<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gamifying Life</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/theme.js"></script>
  <script src="js/settings.js"></script>
</head>
<body>
  <div class="corner">
    <a class="icon-button" href="settings.html" aria-label="Settings">⚙︎</a>
    <button class="icon-button" id="theme-toggle" type="button"></button>
  </div>
  <a class="back" href="index.html">← Home</a>
  <section class="card">
    <div class="summary-row">
      <div id="levels"></div>
      <div id="money-top"></div>
    </div>
  </section>
  <h1>Money</h1>
  <section class="card">
    <p id="progress-label"></p>
    <div class="bar">
      <div class="bar-fill" id="bar-fill"></div>
      <div class="bonus-fill" id="bonus-fill"></div>
    </div>
  </section>
  <section class="card" id="log">
    <h2>Log a spend <span class="muted" id="log-date"></span></h2>
    <input class="money-input amount-input" id="amount" inputmode="decimal" placeholder="$0.00"
      aria-label="Amount spent">
    <div class="filters" id="categories"></div>
    <p class="money-error" id="log-error" hidden></p>
    <ul class="plain-list" id="today-list"></ul>
    <button class="filter-button" id="no-spend" type="button"></button>
  </section>
  <section class="card" id="week"></section>
  <section class="card" id="savings"></section>

  <script src="js/config.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/money-rings.js"></script>
  <script src="js/money-page.js"></script>
</body>
</html>
