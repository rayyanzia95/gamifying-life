<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gamifying Life</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/theme.js"></script>
  <script src="js/settings.js"></script>
</head>
<body class="wide">
  <div class="corner">
    <a class="icon-button" href="settings.html" aria-label="Settings">⚙︎</a>
    <button class="icon-button" id="theme-toggle" type="button"></button>
  </div>
  <a class="back" href="academics.html">← Academics</a>
  <h1>Planner</h1>
  <div class="exam-strip" id="exam-strip" aria-label="Next exams"></div>
  <div class="view-tabs" role="tablist" aria-label="Planner views">
    <button type="button" role="tab" data-view="day">Day</button>
    <button type="button" role="tab" data-view="week">Week</button>
    <button type="button" role="tab" data-view="month">Month</button>
    <button type="button" role="tab" data-view="deadlines">Deadlines</button>
  </div>
  <div class="day-nav" id="day-nav">
    <button type="button" id="prev-day" aria-label="Back">←</button>
    <button type="button" id="go-today">Today</button>
    <button type="button" id="next-day" aria-label="Forward">→</button>
    <span class="muted" id="nav-label"></span>
  </div>
  <div class="day-layout" id="day-view">
    <section class="card" id="day"></section>
    <section class="card" id="day-side"></section>
  </div>
  <div id="week"></div>
  <div id="month"></div>
  <div id="deadlines"></div>

  <script src="js/config.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/deadline-list.js"></script>
  <script src="js/schedule.js"></script>
  <script src="js/planner-week.js"></script>
  <script src="js/planner-month.js"></script>
  <script src="js/planner-deadlines.js"></script>
  <script src="js/planner-page.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"
    integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
  <script defer src="js/sync-merge.js"></script>
  <script defer src="js/sync.js"></script>
</body>
</html>
