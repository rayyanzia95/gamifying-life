<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gamifying Life</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/palettes.css">
  <link rel="stylesheet" href="css/palettes-dark.css">
  <link rel="stylesheet" href="css/appearance.css">
  <link rel="stylesheet" href="css/anims.css">
  <link rel="stylesheet" href="css/layout-hud.css">
  <script src="js/theme.js"></script>
  <script src="js/settings.js"></script>
</head>
<body>
  <div class="corner">
    <button class="icon-button" id="theme-toggle" type="button"></button>
  </div>
  <a class="back" href="index.html">← Home</a>
  <h1>Settings</h1>
  <section class="card">
    <form id="settings"></form>
    <p>Saved on this device, and synced to your other devices once you sign in below.</p>
  </section>
  <a class="card link-card" href="appearance.html">
    <span class="card-title">Appearance</span>
    <span class="muted">Colours, type, bars, ticks, icons, motion →</span>
  </a>
  <section class="card" id="sync">
    <div class="card-title">Sync</div>
    <div id="sync-body"></div>
  </section>
  <section class="card">
    <div class="card-title">Backup</div>
    <p>Saves every event on this device as a file. Do this on each device before turning on sync.</p>
    <button class="filter-button" id="backup" type="button">Download my events</button>
    <p id="backup-note"></p>
  </section>

  <script src="js/config.js"></script>
  <script src="js/config-academics.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/score-chores.js"></script>
  <script src="js/score-health.js"></script>
  <script src="js/score-academics.js"></script>
  <script src="js/score-money.js"></script>
  <script src="js/score-personal.js"></script>
  <script src="js/score-people.js"></script>
  <script src="js/score-levels.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/level-popup.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/anims.js"></script>
  <script src="js/level-up.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/hud-page.js"></script>
  <script src="js/choice-form.js"></script>
  <script src="js/settings-page.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"
    integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
  <script defer src="js/sync-merge.js"></script>
  <script defer src="js/sync.js"></script>
</body>
</html>
