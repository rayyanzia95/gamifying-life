<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gamifying Life</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/theme.js"></script>
  <script src="js/settings.js"></script>
</head>
<body>
  <div class="corner">
    <a class="icon-button" href="settings.html" aria-label="Settings">⚙︎</a>
    <button class="icon-button" id="theme-toggle" type="button"></button>
  </div>
  <a class="back" href="index.html">← Home</a>
  <section class="card">
    <div class="summary-row">
      <div id="levels"></div>
      <div id="dial"></div>
    </div>
    <div id="quran-progress"></div>
  </section>
  <h1>Deen</h1>
  <section class="card">
    <p id="progress-label"></p>
    <div class="bar">
      <div class="bar-fill" id="bar-fill"></div>
      <div class="bonus-fill" id="bonus-fill"></div>
    </div>
    <p id="bonus"></p>
  </section>
  <div class="tiles" id="tiles"></div>
  <div id="view-prayers">
    <ul id="prayers"></ul>
  </div>
  <div id="view-quran" hidden>
    <section class="card" id="revision"></section>
  </div>
  <div id="view-dua" hidden>
    <section class="card" id="dua"></section>
  </div>

  <script src="js/config.js"></script>
  <script src="js/prayer-times.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/sun.js"></script>
  <script src="js/prayer-calc.js"></script>
  <script src="js/streak.js"></script>
  <script src="js/quran.js"></script>
  <script src="js/dua.js"></script>
  <script src="js/dial.js"></script>
  <script src="js/quran-view.js"></script>
  <script src="js/dua-view.js"></script>
  <script src="js/deen.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"
    integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
  <script defer src="js/sync-merge.js"></script>
  <script defer src="js/sync.js"></script>
</body>
</html>
