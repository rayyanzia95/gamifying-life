<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gamifying Life</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/theme.js"></script>
  <script src="js/settings.js"></script>
</head>
<body>
  <div class="corner">
    <a class="icon-button" href="settings.html" aria-label="Settings">⚙︎</a>
    <button class="icon-button" id="theme-toggle" type="button"></button>
  </div>
  <a class="back" href="index.html">← Home</a>
  <section class="card">
    <div class="summary-row">
      <div id="levels"></div>
      <div>
        <div id="wheel"></div>
        <p class="wheel-status" id="wheel-status" aria-live="polite"></p>
      </div>
    </div>
  </section>
  <h1>Chores</h1>
  <section class="card">
    <p id="progress-label"></p>
    <div class="bar">
      <div class="bar-fill" id="bar-fill"></div>
      <div class="bonus-fill" id="bonus-fill"></div>
    </div>
    <p id="bonus"></p>
    <div class="star-row-label">
      <span class="streak" id="streak"></span>
      <span class="muted">last 8 weeks</span>
    </div>
    <div class="stars" id="stars"></div>
  </section>
  <section class="card">
    <ul id="quests"></ul>
  </section>

  <script src="js/config.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/chore-wheel.js"></script>
  <script src="js/chores-page.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"
    integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
  <script defer src="js/sync-merge.js"></script>
  <script defer src="js/sync.js"></script>
</body>
</html>
